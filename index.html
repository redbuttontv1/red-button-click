<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Red Button</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    text-align: center;
}

button {
    width: min(65vw, 320px);
    height: min(65vw, 320px);
    border-radius: 50%;
    border: none;
    background: red;
    color: white;
    font-size: clamp(30px, 8vw, 60px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px red;
}

.glow {
    animation: glow 1s infinite alternate;
}

@keyframes glow {
    from {
        box-shadow: 0 0 20px red;
        transform: scale(1);
    }
    to {
        box-shadow: 0 0 100px red;
        transform: scale(1.05);
    }
}

.info {
    margin-top: 30px;
    font-size: clamp(20px, 5vw, 40px);
}
</style>
</head>

<body>

<div class="container">

<button id="button">CLICK</button>

<div class="info">
🌍 Total clicks: <span id="total">0</span>
<br>
📱 Your clicks: <span id="mine">0</span>
<br>
👥 Devices: <span id="devices">1</span>
</div>

</div>


<script>
const SUPABASE_URL = "https://oudnngdsfgzteluiusir.supabase.co";
const SUPABASE_KEY = "sb_publishable_DDySrSay0NRsscyOjakvtA_au0dNYv8";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

let deviceID = localStorage.getItem("deviceID");
if (!deviceID) {
  deviceID = crypto.randomUUID();
  localStorage.setItem("deviceID", deviceID);
}

const button = document.getElementById("button");
const total = document.getElementById("total");
const mine = document.getElementById("mine");

async function getTotal() {
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/button_stats?id=eq.1&select=total_clicks`,
    { headers }
  );

  const d = await r.json();
  if (d.length) total.textContent = d[0].total_clicks;
}

async function getMine() {
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/device_clicks?device_id=eq.${deviceID}&select=clicks`,
    { headers }
  );

  const d = await r.json();

  if (d.length) {
    mine.textContent = d[0].clicks;
  } else {
    await fetch(
      `${SUPABASE_URL}/rest/v1/device_clicks`,
      {
        method: "POST",
        headers,
        body: JSON.stringify({
          device_id: deviceID,
          clicks: 0
        })
      }
    );

    mine.textContent = 0;
  }
}

button.onclick = async () => {

  button.classList.toggle("glow");

  // Increment global counter safely
  const rpc = await fetch(
    `${SUPABASE_URL}/rest/v1/rpc/increment_clicks`,
    {
      method: "POST",
      headers,
      body: "{}"
    }
  );

  const newTotal = await rpc.json();
  total.textContent = newTotal;

  // Update this device's counter
  let my = Number(mine.textContent) + 1;

  await fetch(
    `${SUPABASE_URL}/rest/v1/device_clicks?device_id=eq.${deviceID}`,
    {
      method: "PATCH",
      headers,
      body: JSON.stringify({
        clicks: my
      })
    }
  );

  mine.textContent = my;
};

getTotal();
getMine();

setInterval(getTotal, 2000);
</script>


</body>
</html>
