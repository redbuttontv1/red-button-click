<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Red Button</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    text-align: center;
}

button {
    width: min(65vw, 320px);
    height: min(65vw, 320px);
    border-radius: 50%;
    border: none;
    background: red;
    color: white;
    font-size: clamp(30px, 8vw, 60px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px red;
}

.glow {
    animation: glow 1s infinite alternate;
}

@keyframes glow {
    from {
        box-shadow: 0 0 20px red;
        transform: scale(1);
    }
    to {
        box-shadow: 0 0 100px red;
        transform: scale(1.05);
    }
}

.info {
    margin-top: 30px;
    font-size: clamp(20px, 5vw, 40px);
}
</style>
</head>

<body>

<div class="container">

<button id="button">CLICK</button>

<div class="info">
🌍 Total clicks: <span id="total">0</span>
<br>
📱 Your clicks: <span id="mine">0</span>
<br>
👥 Devices: <span id="devices">1</span>
</div>

</div>


<script>
const SUPABASE_URL = "https://oudnngdsfgzteluiusir.supabase.co";
const SUPABASE_KEY = "sb_publishable_DDySrSay0NRsscyOjakvtA_au0dNYv8";

let deviceID = localStorage.getItem("deviceID");

if (!deviceID) {
    deviceID = crypto.randomUUID();
    localStorage.setItem("deviceID", deviceID);
}

const button = document.getElementById("button");
const total = document.getElementById("total");
const mine = document.getElementById("mine");


// Load global total
async function loadTotal() {

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/button_stats?id=eq.1",
        {
            headers:{
                "apikey": SUPABASE_KEY
            }
        }
    );

    const data = await response.json();

    if(data[0]){
        total.textContent = data[0].total_clicks;
    }
}


// Load this device's clicks
async function loadMyClicks(){

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/device_clicks?device_id=eq." + deviceID,
        {
            headers:{
                "apikey": SUPABASE_KEY
            }
        }
    );

    const data = await response.json();


    if(data.length > 0){

        mine.textContent = data[0].clicks;

    } else {

        await fetch(
            SUPABASE_URL + "/rest/v1/device_clicks",
            {
                method:"POST",
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    device_id:deviceID,
                    clicks:0
                })
            }
        );

        mine.textContent = 0;
    }
}


// Button press
button.onclick = async ()=>{

    button.classList.toggle("glow");


    let current = Number(total.textContent);
    current++;


    // Update global count
    await fetch(
        SUPABASE_URL + "/rest/v1/button_stats?id=eq.1",
        {
            method:"PATCH",
            headers:{
                "apikey":SUPABASE_KEY,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                total_clicks:current
            })
        }
    );


    // Update device count
    let myCurrent = Number(mine.textContent);
    myCurrent++;


    await fetch(
        SUPABASE_URL + "/rest/v1/device_clicks?device_id=eq." + deviceID,
        {
            method:"PATCH",
            headers:{
                "apikey":SUPABASE_KEY,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                clicks:myCurrent
            })
        }
    );


    total.textContent=current;
    mine.textContent=myCurrent;
};


// Initial load
loadTotal();
loadMyClicks();


// Refresh total automatically
setInterval(loadTotal,3000);

</script>


</body>
</html>
