<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Red Button</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    text-align: center;
}

button {
    width: min(65vw, 320px);
    height: min(65vw, 320px);
    border-radius: 50%;
    border: none;
    background: red;
    color: white;
    font-size: clamp(30px, 8vw, 60px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px red;
}

.glow {
    animation: glow 1s infinite alternate;
}

@keyframes glow {
    from {
        box-shadow: 0 0 20px red;
        transform: scale(1);
    }
    to {
        box-shadow: 0 0 100px red;
        transform: scale(1.05);
    }
}

.info {
    margin-top: 30px;
    font-size: clamp(20px, 5vw, 40px);
}
</style>

</head>

<body>

<div class="container">

<button id="button">CLICK</button>

<div class="info">
🌍 Total clicks: <span id="total">0</span>
<br>
📱 Your clicks: <span id="mine">0</span>
<br>
👥 Devices: <span id="devices">0</span>
</div>

</div>


<script>

const SUPABASE_URL = "https://oudnngdsfgzteluiusir.supabase.co";
const SUPABASE_KEY = "sb_publishable_DDySrSay0NRsscyOjakvtA_au0dNYv8";


const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
};


let deviceID = localStorage.getItem("deviceID");

if (!deviceID) {
    deviceID = crypto.randomUUID();
    localStorage.setItem("deviceID", deviceID);
}


const button = document.getElementById("button");
const total = document.getElementById("total");
const mine = document.getElementById("mine");
const devices = document.getElementById("devices");



// GLOBAL TOTAL

async function getTotal(){

    const r = await fetch(
        `${SUPABASE_URL}/rest/v1/button_stats?id=eq.1&select=total_clicks`,
        {headers}
    );

    const d = await r.json();

    if(d.length){
        total.textContent = d[0].total_clicks;
    }
}



// PERSONAL DEVICE CLICKS

async function getMine(){

    const r = await fetch(
        `${SUPABASE_URL}/rest/v1/device_clicks?device_id=eq.${deviceID}`,
        {headers}
    );

    const d = await r.json();


    if(d.length){

        mine.textContent = d[0].clicks;

    } else {


        await fetch(
            `${SUPABASE_URL}/rest/v1/device_clicks`,
            {
                method:"POST",
                headers,
                body:JSON.stringify({
                    device_id:deviceID,
                    clicks:0
                })
            }
        );


        mine.textContent = 0;
    }
}



// ONLINE DEVICES

async function updatePresence(){

    await fetch(
        `${SUPABASE_URL}/rest/v1/online_devices`,
        {
            method:"POST",
            headers:{
                ...headers,
                "Prefer":"resolution=merge-duplicates"
            },
            body:JSON.stringify({
                device_id:deviceID,
                last_seen:new Date().toISOString()
            })
        }
    );

}


async function getDevices(){

    const r = await fetch(
        `${SUPABASE_URL}/rest/v1/online_devices?select=id`,
        {
            headers
        }
    );

    const d = await r.json();

    console.log("Online devices:", d);

    if (Array.isArray(d)) {
        devices.textContent = d.length;
    } else {
        devices.textContent = 0;
    }

}




// BUTTON CLICK

button.onclick = async ()=>{


    button.classList.toggle("glow");


    const r = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/increment_clicks`,
        {
            method:"POST",
            headers,
            body:"{}"
        }
    );


    const newTotal = await r.json();

    total.textContent = newTotal;



    let myClicks =
    Number(mine.textContent)+1;


    await fetch(
        `${SUPABASE_URL}/rest/v1/device_clicks?device_id=eq.${deviceID}`,
        {
            method:"PATCH",
            headers,
            body:JSON.stringify({
                clicks:myClicks
            })
        }
    );


    mine.textContent=myClicks;

};



// START

getTotal();
getMine();
updatePresence();
getDevices();


setInterval(getTotal,2000);
setInterval(updatePresence,5000);
setInterval(getDevices,2000);


</script>


</body>
</html>
