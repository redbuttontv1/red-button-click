<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Red Button</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    radial-gradient(circle at top,#333,#080808);

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    color:white;
}


.container {
    text-align:center;
    width:100%;
    padding:20px;
}



/* BUTTON */

button {

    width:min(70vw,330px);
    height:min(70vw,330px);

    border-radius:50%;
    border:none;

    cursor:pointer;

    font-size:
    clamp(35px,8vw,65px);

    font-weight:900;

    color:white;

    background:
    radial-gradient(circle at 35% 25%,
    #ff5555,
    #d00000 50%,
    #700000);


    text-shadow:
    0 4px 5px #400;


    box-shadow:

    inset 0 12px 20px rgba(255,255,255,.35),

    inset 0 -25px 30px rgba(0,0,0,.5),

    0 25px 45px rgba(0,0,0,.8),

    0 0 35px red;


    transition:
    .3s ease;

}


button:active {

    transform:
    scale(.96)
    translateY(6px);

}



/* COUNTERS */


.info {

    margin-top:40px;

    padding:25px;

    border-radius:20px;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:
    blur(10px);


    font-size:
    clamp(18px,4vw,32px);


    line-height:1.7;


    box-shadow:
    0 10px 30px rgba(0,0,0,.5);

}



.number {

    color:#ff5555;

    font-weight:900;

    text-shadow:
    0 0 10px red;

}



</style>

</head>


<body>


<div class="container">


<button id="button">
CLICK
</button>


<div class="info">

🌍 Total clicks:
<span id="total" class="number">...</span>

<br>

📱 Your clicks:
<span id="mine" class="number">...</span>


</div>


</div>
<script>

const SUPABASE_URL = "https://oudnngdsfgzteluiusir.supabase.co";
const SUPABASE_KEY = "sb_publishable_DDySrSay0NRsscyOjakvtA_au0dNYv8";


const headers = {

    "apikey": SUPABASE_KEY,

    "Authorization":
    "Bearer " + SUPABASE_KEY,

    "Content-Type":
    "application/json"

};



let deviceID =
localStorage.getItem("deviceID");


if (!deviceID) {

    deviceID =
    crypto.randomUUID();

    localStorage.setItem(
        "deviceID",
        deviceID
    );

}



const button =
document.getElementById("button");

const total =
document.getElementById("total");

const mine =
document.getElementById("mine");





// BUTTON COLORS EVERY 1000 CLICKS

const colors = [

    {
        main:"#d00000",
        light:"#ff5555",
        dark:"#700000"
    },

    {
        main:"#0055ff",
        light:"#55aaff",
        dark:"#002266"
    },

    {
        main:"#00aa44",
        light:"#55ff99",
        dark:"#005522"
    },

    {
        main:"#aa00cc",
        light:"#ee66ff",
        dark:"#550066"
    },

    {
        main:"#ff8800",
        light:"#ffcc55",
        dark:"#994400"
    }

];



function updateButtonColor(clicks){

    let level =
    Math.floor(clicks / 1000)
    %
    colors.length;


    let c =
    colors[level];


    button.style.background =
    `
    radial-gradient(
    circle at 35% 25%,
    ${c.light},
    ${c.main} 50%,
    ${c.dark}
    )
    `;


    button.style.boxShadow =
    `
    inset 0 12px 20px rgba(255,255,255,.35),
    inset 0 -25px 30px rgba(0,0,0,.5),
    0 25px 45px rgba(0,0,0,.8),
    0 0 35px ${c.main}
    `;

}





// LOAD TOTAL

async function getTotal(){

    try {

        const r = await fetch(

        `${SUPABASE_URL}/rest/v1/button_stats?id=eq.1&select=total_clicks`,

        {
            headers
        }

        );


        const d =
        await r.json();


        if(d[0]){

            let clicks =
            d[0].total_clicks;


            total.textContent =
            clicks;


            updateButtonColor(
            clicks
            );

        }


    } catch(e){

        console.log(
        "Total error",
        e
        );

    }

}





// LOAD PERSONAL CLICKS

async function getMine(){

    try {


        const r = await fetch(

        `${SUPABASE_URL}/rest/v1/device_clicks?device_id=eq.${deviceID}`,

        {
            headers
        }

        );


        const d =
        await r.json();



        if(d.length){

            mine.textContent =
            d[0].clicks;


        } else {


            await fetch(

            `${SUPABASE_URL}/rest/v1/device_clicks`,

            {

                method:"POST",

                headers,

                body:JSON.stringify({

                    device_id:deviceID,

                    clicks:0

                })

            }

            );


            mine.textContent=0;

        }


    } catch(e){

        console.log(
        "Mine error",
        e
        );

    }

}






// CLICK

button.onclick = async ()=>{


    try {


        const r =
        await fetch(

        `${SUPABASE_URL}/rest/v1/rpc/increment_clicks`,

        {

            method:"POST",

            headers,

            body:"{}"

        }

        );



        const newTotal =
        await r.json();



        total.textContent =
        newTotal;


        updateButtonColor(
        newTotal
        );




        let myClicks =
        Number(mine.textContent)+1;



        await fetch(

        `${SUPABASE_URL}/rest/v1/device_clicks?device_id=eq.${deviceID}`,

        {

            method:"PATCH",

            headers,

            body:JSON.stringify({

                clicks:myClicks

            })

        }

        );



        mine.textContent =
        myClicks;



    } catch(e){

        console.log(
        "Click error",
        e
        );

    }


};






// START

getTotal();

getMine();



setInterval(
getTotal,
3000
);


</script>


</body>
</html>
